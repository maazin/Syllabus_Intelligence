<!-- Lets a keyboard user skip the navigation and land on the content. -->
<a class="skip-link" href="#main">Skip to content</a>

@if (auth.isAuthenticated()) {
  <header class="topbar">
    <div class="topbar__inner">
      <a class="brand" routerLink="/timeline">
        <span class="brand__mark" aria-hidden="true"></span>
        <span class="brand__name">Syllabus Intelligence</span>
      </a>

      <nav class="nav" aria-label="Main">
        <a class="nav__link" routerLink="/timeline" routerLinkActive="nav__link--on">
          Semester
        </a>
        <a class="nav__link" routerLink="/upload" routerLinkActive="nav__link--on">
          Add syllabus
        </a>
        <a class="nav__link" routerLink="/search" routerLinkActive="nav__link--on">
          Find a course
        </a>
      </nav>

      <button class="btn btn--ghost btn--sm" type="button" (click)="signOut()">Sign out</button>
    </div>
  </header>
}

<main id="main" class="main" [class.main--with-tabs]="auth.isAuthenticated()">
  <router-outlet />
</main>

@if (auth.isAuthenticated()) {
  <!-- Bottom navigation on small screens, which is the reachable position on
       a phone and the platform convention for primary navigation. -->
  <nav class="tabbar" aria-label="Main">
    <a class="tab" routerLink="/timeline" routerLinkActive="tab--on">
      <svg class="tab__icon" viewBox="0 0 24 24" aria-hidden="true">
        <rect x="3" y="4" width="18" height="17" rx="3" />
        <path d="M3 9h18M8 2v4M16 2v4" />
      </svg>
      <span class="tab__label">Semester</span>
    </a>
    <a class="tab" routerLink="/upload" routerLinkActive="tab--on">
      <svg class="tab__icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 16V4M7 9l5-5 5 5" />
        <path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3" />
      </svg>
      <span class="tab__label">Add</span>
    </a>
    <a class="tab" routerLink="/search" routerLinkActive="tab--on">
      <svg class="tab__icon" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="11" cy="11" r="7" />
        <path d="m20 20-3.5-3.5" />
      </svg>
      <span class="tab__label">Find</span>
    </a>
  </nav>
}
