# Secret Manager is the source of truth; External Secrets Operator mirrors it
# into a Kubernetes Secret that pods consume as ordinary environment variables.
#
# The alternative was baking values into manifests or a sealed-secrets file in
# git. Both put the model API key and the database password somewhere a repo
# read can reach them. This way the only thing in git is the *name* of a
# secret, and rotation is a Secret Manager write plus a refresh interval.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: gcp-secret-manager
spec:
  provider:
    gcpsm:
      projectID: PLACEHOLDER_PROJECT_ID
      auth:
        workloadIdentity:
          clusterLocation: PLACEHOLDER_CLUSTER_LOCATION
          clusterName: PLACEHOLDER_CLUSTER_NAME
          serviceAccountRef:
            name: syllint-workload
            namespace: syllint
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: syllint-secrets
  namespace: syllint
spec:
  # Hourly. A rotated credential reaches the pods within the hour without a
  # redeploy, and a tighter interval would spend Secret Manager reads for no
  # benefit on values that change a few times a year.
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: ClusterSecretStore
  target:
    name: syllint-secrets
    creationPolicy: Owner
  data:
    # The key on the left is the environment variable the code reads; the
    # remoteRef is the Secret Manager id Terraform created. These names have
    # disagreed before, and the failure is an empty credential rather than an
    # error, so they are written next to each other on purpose.
    - secretKey: DATABASE_URL
      remoteRef: { key: syllint-production-database-url }
    - secretKey: DATABASE_URL_PSYCOPG
      remoteRef: { key: syllint-production-database-url }
    - secretKey: LLM_API_KEY
      remoteRef: { key: syllint-production-llm-api-key }
    - secretKey: JWT_SECRET
      remoteRef: { key: syllint-production-jwt-secret }
    - secretKey: R2_ACCESS_KEY_ID
      remoteRef: { key: syllint-production-r2-access-key-id }
    - secretKey: R2_SECRET_ACCESS_KEY
      remoteRef: { key: syllint-production-r2-secret-access-key }
    - secretKey: TOKEN_ENCRYPTION_KEY
      remoteRef: { key: syllint-production-token-encryption-key }
---
# The Airflow chart wants its session key in a Secret of its own, under a key
# name it chooses. Fixed rather than generated: a key that changes on every
# `helm upgrade` logs every operator out on each deploy.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: airflow-webserver-secret
  namespace: syllint
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: ClusterSecretStore
  target:
    name: airflow-webserver-secret
    creationPolicy: Owner
  data:
    - secretKey: webserver-secret-key
      remoteRef: { key: syllint-production-airflow-webserver-key }
---
# Everything that is not a credential. Kept apart from the secret so that
# reading the configuration of this system does not require secret access.
apiVersion: v1
kind: ConfigMap
metadata:
  name: syllint-config
  namespace: syllint
data:
  ENVIRONMENT: production
  OCR_MODE: docling
  REDIS_URL: redis://redis:6379/0
  MLFLOW_TRACKING_URI: http://mlflow:5000
  R2_BUCKET: PLACEHOLDER_R2_BUCKET
  R2_ENDPOINT: PLACEHOLDER_R2_ENDPOINT
  LLM_MODEL_SYNC: claude-sonnet-5
  LLM_MODEL_STRONG: claude-opus-5
  LLM_MODEL_BATCH: claude-sonnet-5
  SYLLINT_REPO_ROOT: /opt/syllabus-intelligence
  DBT_TARGET: prod
