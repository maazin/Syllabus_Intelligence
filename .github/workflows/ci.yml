# lint -> typecheck -> unit tests -> build  (PRD section 27.1)
#
# Unlimited minutes on public repos (18.1), which is the whole reason to make
# the repo public.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Called by the deploy workflow, so production is gated on the same suite the
  # pull request ran rather than on a trimmed copy of it that drifts.
  workflow_call:

concurrency:
  # Keyed by workflow as well as ref. A push to main starts this workflow and
  # also starts Deploy, which calls this workflow; on a ref-only key those two
  # runs share a group and cancel each other, and the deploy fails for a reason
  # that looks like nothing to do with deploying.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv tool run ruff check .
      - run: uv tool run ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # A managed interpreter, not the runner's system Python. `uv pip install
      # --system` against /usr fails outright on a PEP 668 externally-managed
      # interpreter, which is what every Python job here was doing.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Installed into the same environment mypy runs in. `uv tool run mypy`
      # builds an isolated environment that cannot see these, so every import of
      # sqlalchemy, pydantic or the shared library resolved to a missing module
      # and the job reported hundreds of findings that were all one missing path.
      - run: uv pip install --system -r services/worker/requirements.txt -r services/api/requirements.txt mypy
      # strict on packages/core, typed-but-not-strict on services/* (section 27).
      # Two invocations rather than a per-module `strict = true`, because mypy 2
      # leaks that flag set into the rest of the run.
      - run: python -m mypy --strict packages/core
      - run: python -m mypy services

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: syllint
        ports: ["5533:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5533/syllint
      JWT_SECRET: ci-secret-long-enough-for-hmac-sha256-minimum
      INSTITUTION_EMAIL_DOMAIN: test.edu
      ENVIRONMENT: local
      # Upload goes through the real S3 client against real object storage
      # rather than a mock, because the thing worth testing is that boto3 code
      # written for R2 works unchanged against an S3 implementation.
      R2_ENDPOINT: http://localhost:9100
      R2_ACCESS_KEY_ID: localstack
      R2_SECRET_ACCESS_KEY: localstack
      R2_BUCKET: syllabi
    steps:
      - uses: actions/checkout@v4

      # LocalStack, not MinIO. MinIO stopped publishing pullable images: Docker
      # Hub answers "pull access denied" and quay.io now requires auth for the
      # whole repository, which broke every job that could not pull from a warm
      # cache. LocalStack implements the same S3 API, so nothing in the
      # application changes.
      #
      # A step rather than a service container, because LocalStack needs a
      # command and a service container cannot set one.
      - name: Start object storage
        run: |
          docker run -d --name objectstore -p 9100:4566 \
            -e SERVICES=s3 localstack/localstack:3
          for attempt in $(seq 1 40); do
            if curl -sf http://localhost:9100/_localstack/health >/dev/null; then break; fi
            sleep 3
          done
          # storage.py does not create the bucket, which is the right call for
          # production and means every environment has to.
          docker exec objectstore awslocal s3 mb s3://syllabi
      - uses: astral-sh/setup-uv@v5
      # A managed interpreter, not the runner's system Python. `uv pip install
      # --system` against /usr fails outright on a PEP 668 externally-managed
      # interpreter, which is what every Python job here was doing.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: uv pip install --system -r services/api/requirements.txt pdfplumber python-docx beautifulsoup4 reportlab pillow pytest anthropic
      - run: |
          cd packages/core && alembic upgrade head
      - run: python scripts/generate_fixture_syllabi.py
      - run: python scripts/seed_dev_data.py
      # The eval gate is deliberately excluded here: it costs money and lives in
      # its own workflow (27.2).
      - run: pytest -q -m "not eval"

  # The corpus transformation is SQL, so it is tested as SQL: dbt builds the
  # models against a real Postgres and runs its own assertions. A model that
  # compiles but publishes an unreviewed profile is a 14.2 violation, and
  # `dbt test` is what catches it.
  dbt:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: syllint
        ports: ["5533:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5533/syllint
      # Absolute. Every dbt step below cds into this directory first, so a
      # relative path is resolved from inside it and points at
      # services/pipeline/dbt/services/pipeline/dbt.
      DBT_PROFILES_DIR: ${{ github.workspace }}/services/pipeline/dbt
      POSTGRES_PORT: "5533"
      POSTGRES_DB: syllint
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # A managed interpreter, not the runner's system Python. `uv pip install
      # --system` against /usr fails outright on a PEP 668 externally-managed
      # interpreter, which is what every Python job here was doing.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: uv pip install --system "dbt-core>=1.8" "dbt-postgres>=1.8" "psycopg[binary]" sqlalchemy alembic pydantic
      - run: cd packages/core && alembic upgrade head
      - run: python scripts/seed_dev_data.py
      # Compiles every model without touching the warehouse, so a broken ref or
      # a bad macro fails in seconds rather than after a full build.
      - run: cd services/pipeline/dbt && dbt parse
      - run: cd services/pipeline/dbt && dbt build

  # Terraform is validated, never applied, from CI. An apply needs cloud
  # credentials and a human who meant it.
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -check -recursive
        working-directory: infra/terraform
      - run: terraform init -backend=false
        working-directory: infra/terraform
      - run: terraform validate
        working-directory: infra/terraform

  # A DAG that fails to import is a silently dead schedule, and Airflow reports
  # that only in its own UI. Parsing it in CI turns it into a failed build.
  airflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check the DAG imports
        run: |
          pip install "apache-airflow==2.10.5" \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-2.10.5/constraints-3.11.txt"
          python - <<'PY'
          from airflow.models import DagBag
          bag = DagBag('services/pipeline/dags', include_examples=False)
          assert not bag.import_errors, bag.import_errors
          assert 'corpus_aggregation' in bag.dags
          dag = bag.dags['corpus_aggregation']
          print(f"{dag.dag_id}: {len(dag.tasks)} tasks, schedule {dag.schedule_interval}")
          PY

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      # A type error in a template is a broken screen, so the build is the gate.
      - run: npm run build
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      # The e2e suite stubs the API, so it needs no database or worker. It also
      # carries the accessibility checks, which are the ones most likely to
      # regress unnoticed.
      - run: npm run e2e
        working-directory: apps/web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/test-results/
          retention-days: 7

  # A manifest that does not parse is a deploy that fails after the images are
  # already pushed and the migration has already run. Validating here costs
  # seconds and moves that failure to the pull request.
  #
  # The CRD schemas matter as much as the built-in ones: KEDA's ScaledObject and
  # External Secrets' ExternalSecret are where the deploy-time values live, and
  # a plain kubeconform run skips anything it has no schema for, reporting a
  # typo in a CRD as "skipped" rather than as an error.
  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render with representative values
        env:
          PROJECT_ID: example-project
          CLUSTER_NAME: syllint-production-cluster
          CLUSTER_LOCATION: us-central1-a
          WORKLOAD_SA: syllint-production-workload@example-project.iam.gserviceaccount.com
          REDIS_IP: 10.128.0.9
          R2_BUCKET: syllint-production-syllabi
          R2_ENDPOINT: https://account.r2.cloudflarestorage.com
          WORKER_IMAGE: us-central1-docker.pkg.dev/example-project/syllint/worker:ci
          MLFLOW_IMAGE: us-central1-docker.pkg.dev/example-project/syllint/mlflow:ci
        run: ./infra/k8s/render.sh > /tmp/rendered.yaml

      - name: Validate against Kubernetes and CRD schemas
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar xz kubeconform
          ./kubeconform -strict -summary \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            /tmp/rendered.yaml

      # Every object must land in the project's namespace. A manifest that
      # omits it is applied to whatever namespace the deploying context happens
      # to have, which is how a workload ends up in `default` and invisible.
      - name: Check namespacing
        run: |
          python3 - <<'PY'
          import sys, yaml
          cluster_scoped = {"Namespace", "ClusterSecretStore"}
          bad = [
              f"{d['kind']}/{d['metadata']['name']}"
              for d in yaml.safe_load_all(open('/tmp/rendered.yaml'))
              if d and d['kind'] not in cluster_scoped
              and d['metadata'].get('namespace') != 'syllint'
          ]
          if bad:
              sys.exit('not namespaced into syllint: ' + ', '.join(bad))
          print('all namespaced objects are in syllint')
          PY

      - name: Lint the Airflow values
        env:
          AIRFLOW_REPO: us-central1-docker.pkg.dev/example-project/syllint/airflow
          AIRFLOW_TAG: ci
        run: |
          ./infra/k8s/render-airflow.sh > /tmp/airflow-values.yaml
          helm repo add apache-airflow https://airflow.apache.org
          helm repo update
          # Renders the chart with these values and fails on a value the chart
          # does not accept, which is the class of error that otherwise shows up
          # ten minutes into a production `helm upgrade --wait`.
          helm template airflow apache-airflow/airflow \
            --version 1.16.0 \
            --namespace syllint --values /tmp/airflow-values.yaml > /tmp/airflow-rendered.yaml
          # The chart version and the image's Airflow version have to agree.
          # Chart 1.17+ renders Airflow 3 components that a 2.10.5 image cannot
          # run, and the manifests are valid either way, so schema validation
          # cannot catch it. The webserver's presence is the cheapest proxy.
          grep -q "name: airflow-webserver" /tmp/airflow-rendered.yaml \
            || { echo "chart rendered no webserver: it is an Airflow 3 chart against a 2.x image"; exit 1; }
          echo "airflow chart renders against the 2.10.5 topology"

  # The one job that runs the pieces together. The Python suite stubs the
  # queue and the browser suite stubs the API, and each is right to; the gap
  # they leave between them is where every MVP-blocking bug so far has lived.
  # This brings up the compose stack, with the model replaced by a recorded
  # extraction, and drives sign-in through heatmap over HTTP.
  smoke:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5533/syllint
      JWT_SECRET: local-dev-secret-not-for-production
      INSTITUTION_EMAIL_DOMAIN: test.edu
      ENVIRONMENT: local
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Start the stack
        run: |
          docker compose -f infra/docker/docker-compose.yml up -d --build \
            postgres redis objectstore mailhog api worker

      - run: uv pip install --system -r services/api/requirements.txt pdfplumber python-docx beautifulsoup4 reportlab pillow pytest httpx
      - run: cd packages/core && alembic upgrade head
      - run: python scripts/generate_fixture_syllabi.py
      - run: python scripts/seed_dev_data.py

      - name: Wait for the API
        run: |
          for attempt in $(seq 1 30); do
            if curl -sf http://localhost:8100/health >/dev/null; then exit 0; fi
            sleep 3
          done
          echo "API never became healthy"
          docker compose -f infra/docker/docker-compose.yml logs api
          exit 1

      - name: Drive the loop
        env:
          SMOKE_API_URL: http://localhost:8100
          SMOKE_MAILHOG_URL: http://localhost:8125
        run: pytest tests/smoke -q -p no:cacheprovider

      - name: Stack logs
        if: failure()
        run: docker compose -f infra/docker/docker-compose.yml logs --tail 200 api worker

  build:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, dbt, terraform, airflow, manifests, web, smoke]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f services/api/Dockerfile -t syllint-api .
      - run: docker build -f services/worker/Dockerfile -t syllint-worker .
